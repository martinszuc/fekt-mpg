<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="3" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#999"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">8-násobná symetrie kružnice</text>

  <g transform="translate(250, 260)">
    <!-- Circle -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#333" stroke-width="1.5"/>

    <!-- Axes (dashed) -->
    <line x1="-210" y1="0" x2="210" y2="0" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="0" y1="-210" x2="0" y2="210" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
    <!-- Diagonals (dashed) -->
    <line x1="-150" y1="-150" x2="150" y2="150" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="-150" y1="150" x2="150" y2="-150" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>

    <!-- Octant labels -->
    <text x="100" y="-30" text-anchor="middle" font-size="11" fill="#888">I</text>
    <text x="35" y="-100" text-anchor="middle" font-size="11" fill="#888">II</text>
    <text x="-35" y="-100" text-anchor="middle" font-size="11" fill="#888">III</text>
    <text x="-100" y="-30" text-anchor="middle" font-size="11" fill="#888">IV</text>
    <text x="-100" y="40" text-anchor="middle" font-size="11" fill="#888">V</text>
    <text x="-35" y="110" text-anchor="middle" font-size="11" fill="#888">VI</text>
    <text x="35" y="110" text-anchor="middle" font-size="11" fill="#888">VII</text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#888">VIII</text>

    <!-- Example: point (3,9) on circle r≈9.49, scaled to r=180 → scale=180/9.49≈19 -->
    <!-- (3,9): (57, -171), (9,3): (171, -57), (-3,9): (-57,-171), (-9,3): (-171,-57) -->
    <!-- (3,-9): (57,171), (9,-3): (171,57), (-3,-9): (-57,171), (-9,-3): (-171,57) -->

    <!-- Computed point (red) -->
    <circle cx="57" cy="-171" r="7" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
    <text x="72" y="-175" font-size="12" fill="#e53935" font-weight="bold">(x, y)</text>

    <!-- Symmetric points (blue) -->
    <circle cx="171" cy="-57" r="6" fill="#1976d2" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="178" y="-62" font-size="11" fill="#1976d2">(y, x)</text>

    <circle cx="-57" cy="-171" r="6" fill="#1976d2" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="-110" y="-175" font-size="11" fill="#1976d2">(−x, y)</text>

    <circle cx="-171" cy="-57" r="6" fill="#1976d2" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="-225" y="-62" font-size="11" fill="#1976d2">(−y, x)</text>

    <circle cx="57" cy="171" r="6" fill="#1976d2" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="72" y="185" font-size="11" fill="#1976d2">(x, −y)</text>

    <circle cx="171" cy="57" r="6" fill="#1976d2" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="178" y="72" font-size="11" fill="#1976d2">(y, −x)</text>

    <circle cx="-57" cy="171" r="6" fill="#1976d2" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="-115" y="185" font-size="11" fill="#1976d2">(−x, −y)</text>

    <circle cx="-171" cy="57" r="6" fill="#1976d2" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="-230" y="72" font-size="11" fill="#1976d2">(−y, −x)</text>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="3" fill="#333"/>

    <!-- Axis labels -->
    <text x="215" y="15" font-size="12" fill="#666">x</text>
    <text x="8" y="-205" font-size="12" fill="#666">y</text>
  </g>

  <!-- Legend -->
  <circle cx="30" cy="475" r="6" fill="#e53935"/>
  <text x="42" y="479" font-size="11" fill="#333">Spočítaný bod (1 výpočet)</text>
  <circle cx="250" cy="475" r="5" fill="#1976d2"/>
  <text x="262" y="479" font-size="11" fill="#333">Symetrické body (zdarma)</text>
</svg>
