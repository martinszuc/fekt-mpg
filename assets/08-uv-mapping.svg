<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" font-family="sans-serif" font-size="14">
  <defs>
    <!-- Grid pattern for UV space -->
    <pattern id="uvGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#fff"/>
      <rect width="20" height="20" fill="#ffcccc"/>
      <rect x="20" y="20" width="20" height="20" fill="#ccccff"/>
      <rect x="20" width="20" height="20" fill="#ccffcc"/>
      <rect y="20" width="20" height="20" fill="#ffffcc"/>
    </pattern>

    <!-- 3D pattern for box face -->
    <pattern id="uvGrid3d" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fff"/>
      <rect width="12" height="12" fill="#ffcccc"/>
      <rect x="12" y="12" width="12" height="12" fill="#ccccff"/>
      <rect x="12" width="12" height="12" fill="#ccffcc"/>
      <rect y="12" width="12" height="12" fill="#ffffcc"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="700" height="350" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">UV Mapovani: 2D textura na 3D objekt</text>

  <!-- === LEFT: UV Space (2D texture) === -->

  <text x="130" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">UV prostor (textura)</text>

  <!-- UV rectangle -->
  <rect x="30" y="70" width="200" height="200" fill="url(#uvGrid)" stroke="#333" stroke-width="2"/>

  <!-- UV axes -->
  <text x="20" y="280" font-size="12" fill="#666">(0,0)</text>
  <text x="215" y="280" font-size="12" fill="#666">(1,0)</text>
  <text x="20" y="65" font-size="12" fill="#666">(0,1)</text>
  <text x="215" y="65" font-size="12" fill="#666">(1,1)</text>

  <!-- U axis -->
  <line x1="30" y1="275" x2="230" y2="275" stroke="#e74c3c" stroke-width="2"/>
  <text x="130" y="298" text-anchor="middle" font-size="13" fill="#e74c3c" font-weight="bold">u</text>

  <!-- V axis -->
  <line x1="25" y1="270" x2="25" y2="70" stroke="#27ae60" stroke-width="2"/>
  <text x="12" y="175" text-anchor="middle" font-size="13" fill="#27ae60" font-weight="bold">v</text>

  <!-- Marked points on texture -->
  <circle cx="80" cy="220" r="4" fill="#e74c3c"/>
  <text x="80" y="240" text-anchor="middle" font-size="10" fill="#e74c3c">A</text>

  <circle cx="180" cy="120" r="4" fill="#4a90d9"/>
  <text x="180" y="110" text-anchor="middle" font-size="10" fill="#4a90d9">B</text>

  <!-- === CURVED ARROWS (mapping) === -->

  <path d="M 240,130 C 310,80 360,80 420,110" fill="none" stroke="#ff9800" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="420,110 412,102 416,114" fill="#ff9800"/>

  <path d="M 240,210 C 310,260 360,260 430,200" fill="none" stroke="#ff9800" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="430,200 422,204 432,210" fill="#ff9800"/>

  <text x="335" y="75" text-anchor="middle" font-size="13" fill="#ff9800" font-weight="bold">mapovani</text>

  <!-- === RIGHT: 3D Box === -->

  <text x="540" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3D objekt (krabice)</text>

  <!-- 3D box - front face -->
  <polygon points="430,130 580,130 580,280 430,280" fill="url(#uvGrid3d)" stroke="#333" stroke-width="2"/>

  <!-- 3D box - top face -->
  <polygon points="430,130 480,80 630,80 580,130" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
  <line x1="455" y1="105" x2="605" y2="105" stroke="#ccc" stroke-width="0.5"/>
  <line x1="505" y1="80" x2="455" y2="130" stroke="#ccc" stroke-width="0.5"/>
  <line x1="555" y1="80" x2="505" y2="130" stroke="#ccc" stroke-width="0.5"/>

  <!-- 3D box - right face -->
  <polygon points="580,130 630,80 630,230 580,280" fill="#d0d0d0" stroke="#333" stroke-width="1.5"/>
  <line x1="605" y1="105" x2="605" y2="255" stroke="#ccc" stroke-width="0.5"/>
  <line x1="580" y1="205" x2="630" y2="155" stroke="#ccc" stroke-width="0.5"/>

  <!-- Marked points on 3D object -->
  <circle cx="470" cy="240" r="4" fill="#e74c3c"/>
  <text x="460" y="255" text-anchor="middle" font-size="10" fill="#e74c3c">A</text>

  <circle cx="540" cy="170" r="4" fill="#4a90d9"/>
  <text x="555" y="168" text-anchor="middle" font-size="10" fill="#4a90d9">B</text>

  <!-- Bottom explanation -->
  <text x="350" y="325" text-anchor="middle" font-size="12" fill="#888" font-style="italic">Kazdy vertex 3D modelu ma prirazene UV souradnice (u,v) z rozsahu [0,1]</text>
  <text x="350" y="342" text-anchor="middle" font-size="12" fill="#888" font-style="italic">urcujici, ktera cast textury se na nej namapuje</text>
</svg>