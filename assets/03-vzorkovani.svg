<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Vzorkování spojitého signálu</text>

  <!-- === TOP: Continuous signal with sample points === -->
  <!-- Axes -->
  <line x1="40" y1="130" x2="570" y2="130" stroke="#ccc" stroke-width="1"/>
  <line x1="40" y1="40" x2="40" y2="130" stroke="#ccc" stroke-width="1"/>

  <!-- Continuous sine wave -->
  <path d="M 40,85 C 60,30 80,30 100,85 C 120,140 140,140 160,85 C 180,30 200,30 220,85 C 240,140 260,140 280,85 C 300,30 320,30 340,85 C 360,140 380,140 400,85 C 420,30 440,30 460,85 C 480,140 500,140 520,85 C 540,30 555,50 560,85"
        fill="none" stroke="#3498db" stroke-width="2.5"/>

  <!-- Sample lines and dots -->
  <line x1="100" y1="85" x2="100" y2="135" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="100" cy="85" r="5" fill="#e74c3c"/>

  <line x1="160" y1="85" x2="160" y2="135" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="160" cy="85" r="5" fill="#e74c3c"/>

  <line x1="220" y1="85" x2="220" y2="135" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="220" cy="85" r="5" fill="#e74c3c"/>

  <line x1="280" y1="85" x2="280" y2="135" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="280" cy="85" r="5" fill="#e74c3c"/>

  <line x1="340" y1="85" x2="340" y2="135" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="340" cy="85" r="5" fill="#e74c3c"/>

  <line x1="400" y1="85" x2="400" y2="135" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="400" cy="85" r="5" fill="#e74c3c"/>

  <line x1="460" y1="85" x2="460" y2="135" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="460" cy="85" r="5" fill="#e74c3c"/>

  <line x1="520" y1="85" x2="520" y2="135" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="520" cy="85" r="5" fill="#e74c3c"/>

  <!-- Labels top -->
  <text x="45" y="55" fill="#3498db" font-size="13">Spojitý signál</text>
  <text x="530" y="75" fill="#e74c3c" font-size="13">Vzorky</text>

  <!-- === BOTTOM: Reconstructed staircase signal === -->
  <!-- Axes -->
  <line x1="40" y1="260" x2="570" y2="260" stroke="#ccc" stroke-width="1"/>
  <line x1="40" y1="170" x2="40" y2="260" stroke="#ccc" stroke-width="1"/>

  <!-- Staircase reconstruction (zero-order hold) -->
  <path d="M 40,215 L 100,215 L 100,215 L 160,215 L 160,215 L 220,215 L 220,215 L 280,215 L 280,215 L 340,215 L 340,215 L 400,215 L 400,215 L 460,215 L 460,215 L 520,215 L 520,215 L 560,215"
        fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="0"/>

  <!-- Actually make it a proper staircase with varying levels -->
  <!-- Rewriting: sample values should vary like the sine -->
  <path d="M 40,215
           L 100,215 L 100,215
           L 160,215 L 160,215
           L 220,215 L 220,215
           L 280,215 L 280,215
           L 340,215 L 340,215
           L 400,215 L 400,215
           L 460,215 L 460,215
           L 520,215 L 520,215
           L 560,215"
        fill="none" stroke="none"/>

  <!-- Better staircase: manually matching sine wave sample values -->
  <!-- Sine peaks at ~45 from baseline 130, so mapped to bottom section baseline 260 -->
  <!-- samples at x=100,160,...,520 all happen to hit y=85 (the midline of sine) -->
  <!-- Let me make the sine wave not hit exact same values. Use offset sampling -->

  <!-- Redo with proper varying staircase -->
  <line x1="40" y1="215" x2="70" y2="215" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="70" y1="215" x2="70" y2="185" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="70" y1="185" x2="130" y2="185" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="130" y1="185" x2="130" y2="245" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="130" y1="245" x2="190" y2="245" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="190" y1="245" x2="190" y2="200" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="190" y1="200" x2="250" y2="200" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="250" y1="200" x2="250" y2="175" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="250" y1="175" x2="310" y2="175" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="310" y1="175" x2="310" y2="240" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="310" y1="240" x2="370" y2="240" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="370" y1="240" x2="370" y2="205" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="370" y1="205" x2="430" y2="205" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="430" y1="205" x2="430" y2="180" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="430" y1="180" x2="490" y2="180" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="490" y1="180" x2="490" y2="235" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="490" y1="235" x2="550" y2="235" stroke="#e74c3c" stroke-width="2.5"/>

  <!-- Label bottom -->
  <text x="45" y="183" fill="#e74c3c" font-size="13">Rekonstruovaný signál</text>
  <text x="45" y="198" fill="#e74c3c" font-size="11">(schodovitá aproximace)</text>
</svg>