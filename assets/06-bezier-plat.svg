<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="arrow-u" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1976d2"/>
    </marker>
    <marker id="arrow-v" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e53935"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Bézierův bikubický plát — 4×4 řídicích bodů</text>

  <g transform="translate(100, 50)">
    <!-- 4x4 grid of control points with slight vertical displacement for 3D feel -->
    <!-- Using isometric-like projection -->
    <!-- Row 0 (v=0): bottom front -->
    <!-- Row 3 (v=3): top back -->

    <!-- Grid positions: each cell ~90px in u, ~80px in v with perspective shift -->
    <!-- u direction: right, v direction: up-right (isometric) -->

    <!-- Control point positions -->
    <!-- Row 0 (front): -->
    <!-- P00=(60,330), P10=(170,325), P20=(280,320), P30=(390,330) -->
    <!-- Row 1: -->
    <!-- P01=(80,260), P11=(185,240), P21=(290,235), P31=(395,255) -->
    <!-- Row 2: -->
    <!-- P02=(100,180), P12=(200,150), P22=(300,145), P32=(400,170) -->
    <!-- Row 3 (back): -->
    <!-- P03=(120,100), P13=(215,75), P23=(310,70), P33=(405,90) -->

    <!-- Surface fill (light mesh) -->
    <polygon points="60,330 390,330 405,90 120,100" fill="#e3f2fd" fill-opacity="0.3" stroke="none"/>

    <!-- Grid lines in u-direction (gray) -->
    <!-- Row 0 -->
    <polyline points="60,330 170,325 280,320 390,330" fill="none" stroke="#bbb" stroke-width="1"/>
    <!-- Row 1 -->
    <polyline points="80,260 185,240 290,235 395,255" fill="none" stroke="#bbb" stroke-width="1"/>
    <!-- Row 2 -->
    <polyline points="100,180 200,150 300,145 400,170" fill="none" stroke="#bbb" stroke-width="1"/>
    <!-- Row 3 -->
    <polyline points="120,100 215,75 310,70 405,90" fill="none" stroke="#bbb" stroke-width="1"/>

    <!-- Grid lines in v-direction (gray) -->
    <!-- Col 0 -->
    <polyline points="60,330 80,260 100,180 120,100" fill="none" stroke="#bbb" stroke-width="1"/>
    <!-- Col 1 -->
    <polyline points="170,325 185,240 200,150 215,75" fill="none" stroke="#bbb" stroke-width="1"/>
    <!-- Col 2 -->
    <polyline points="280,320 290,235 300,145 310,70" fill="none" stroke="#bbb" stroke-width="1"/>
    <!-- Col 3 -->
    <polyline points="390,330 395,255 400,170 405,90" fill="none" stroke="#bbb" stroke-width="1"/>

    <!-- Surface curves (darker, suggesting the actual surface) -->
    <path d="M60,330 C120,310 320,305 390,330" fill="none" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M80,260 C140,225 340,220 395,255" fill="none" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M100,180 C160,140 340,135 400,170" fill="none" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M120,100 C170,65 350,60 405,90" fill="none" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Control points -->
    <!-- Corner points (larger, labeled) -->
    <circle cx="60" cy="330" r="6" fill="#1565c0" stroke="#0d47a1" stroke-width="1"/>
    <circle cx="390" cy="330" r="6" fill="#1565c0" stroke="#0d47a1" stroke-width="1"/>
    <circle cx="120" cy="100" r="6" fill="#1565c0" stroke="#0d47a1" stroke-width="1"/>
    <circle cx="405" cy="90" r="6" fill="#1565c0" stroke="#0d47a1" stroke-width="1"/>

    <!-- Interior and edge points (smaller) -->
    <circle cx="170" cy="325" r="4" fill="#42a5f5"/>
    <circle cx="280" cy="320" r="4" fill="#42a5f5"/>
    <circle cx="80" cy="260" r="4" fill="#42a5f5"/>
    <circle cx="185" cy="240" r="4" fill="#42a5f5"/>
    <circle cx="290" cy="235" r="4" fill="#42a5f5"/>
    <circle cx="395" cy="255" r="4" fill="#42a5f5"/>
    <circle cx="100" cy="180" r="4" fill="#42a5f5"/>
    <circle cx="200" cy="150" r="4" fill="#42a5f5"/>
    <circle cx="300" cy="145" r="4" fill="#42a5f5"/>
    <circle cx="400" cy="170" r="4" fill="#42a5f5"/>
    <circle cx="215" cy="75" r="4" fill="#42a5f5"/>
    <circle cx="310" cy="70" r="4" fill="#42a5f5"/>

    <!-- Corner labels -->
    <text x="40" y="348" font-size="13" fill="#0d47a1" font-weight="bold">P₀₀</text>
    <text x="385" y="353" font-size="13" fill="#0d47a1" font-weight="bold">P₃₀</text>
    <text x="95" y="93" font-size="13" fill="#0d47a1" font-weight="bold">P₀₃</text>
    <text x="408" y="85" font-size="13" fill="#0d47a1" font-weight="bold">P₃₃</text>

    <!-- u-direction arrow -->
    <line x1="60" y1="370" x2="180" y2="370" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow-u)"/>
    <text x="120" y="390" text-anchor="middle" font-size="14" fill="#1976d2" font-weight="bold">u</text>

    <!-- v-direction arrow -->
    <line x1="30" y1="330" x2="50" y2="230" stroke="#e53935" stroke-width="2" marker-end="url(#arrow-v)"/>
    <text x="22" y="280" text-anchor="middle" font-size="14" fill="#e53935" font-weight="bold">v</text>
  </g>

  <!-- Info text -->
  <text x="300" y="435" text-anchor="middle" font-size="12" fill="#666">16 řídicích bodů (4×4) — povrch prochází rohovými body</text>
</svg>
