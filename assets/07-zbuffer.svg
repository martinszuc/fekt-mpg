<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Z-buffer: Bocni pohled a aktualizace</text>

  <!-- === TOP: Side view === -->

  <!-- Camera -->
  <polygon points="40,100 60,85 60,115" fill="#333"/>
  <text x="50" y="130" text-anchor="middle" font-size="12" fill="#333">Kamera</text>

  <!-- Depth axis -->
  <line x1="70" y1="100" x2="420" y2="100" stroke="#aaa" stroke-width="1" marker-end="url(#arrowR)"/>
  <text x="430" y="104" font-size="11" fill="#888">z (hloubka)</text>

  <!-- Screen/pixel -->
  <rect x="70" y="60" width="4" height="80" fill="#4a90d9" rx="1"/>
  <text x="72" y="55" text-anchor="middle" font-size="11" fill="#4a90d9">Pixel</text>

  <!-- Triangle 1: Blue at z=0.7 -->
  <polygon points="280,65 300,100 260,100" fill="#3498db" opacity="0.7" stroke="#2980b9" stroke-width="1.5"/>
  <text x="280" y="55" text-anchor="middle" font-size="12" fill="#2980b9" font-weight="bold">z = 0.7</text>
  <text x="280" y="125" text-anchor="middle" font-size="11" fill="#2980b9">Modry</text>

  <!-- Triangle 2: Red at z=0.3 -->
  <polygon points="150,70 170,100 130,100" fill="#e74c3c" opacity="0.7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="150" y="60" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">z = 0.3</text>
  <text x="150" y="125" text-anchor="middle" font-size="11" fill="#c0392b">Cerveny</text>

  <!-- Triangle 3: Green at z=0.5 -->
  <polygon points="215,72 235,100 195,100" fill="#27ae60" opacity="0.7" stroke="#1e8449" stroke-width="1.5"/>
  <text x="215" y="62" text-anchor="middle" font-size="12" fill="#1e8449" font-weight="bold">z = 0.5</text>
  <text x="215" y="125" text-anchor="middle" font-size="11" fill="#1e8449">Zeleny</text>

  <!-- === BOTTOM: Z-buffer update steps === -->

  <text x="20" y="175" font-size="13" font-weight="bold" fill="#333">Aktualizace z-bufferu pro tento pixel:</text>

  <!-- Step 0: Init -->
  <rect x="20" y="190" width="120" height="55" rx="6" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5"/>
  <text x="80" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Inicializace</text>
  <text x="80" y="230" text-anchor="middle" font-size="16" fill="#555">z = infinity</text>

  <!-- Arrow -->
  <line x1="145" y1="217" x2="160" y2="217" stroke="#555" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Step 1: Blue triangle z=0.7 -->
  <rect x="168" y="190" width="120" height="55" rx="6" fill="#d4e6f1" stroke="#3498db" stroke-width="2"/>
  <text x="228" y="207" text-anchor="middle" font-size="11" fill="#2980b9">Modry z=0.7</text>
  <text x="228" y="222" text-anchor="middle" font-size="11" fill="#333">0.7 &lt; infinity ?  ANO</text>
  <text x="228" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">z = 0.7</text>

  <!-- Arrow -->
  <line x1="293" y1="217" x2="308" y2="217" stroke="#555" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Step 2: Red triangle z=0.3 -->
  <rect x="316" y="190" width="120" height="55" rx="6" fill="#f5b7b1" stroke="#e74c3c" stroke-width="2"/>
  <text x="376" y="207" text-anchor="middle" font-size="11" fill="#c0392b">Cerveny z=0.3</text>
  <text x="376" y="222" text-anchor="middle" font-size="11" fill="#333">0.3 &lt; 0.7 ?  ANO</text>
  <text x="376" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">z = 0.3</text>

  <!-- Arrow -->
  <line x1="441" y1="217" x2="456" y2="217" stroke="#555" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Step 3: Green triangle z=0.5 — REJECTED -->
  <rect x="464" y="190" width="140" height="55" rx="6" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="534" y="207" text-anchor="middle" font-size="11" fill="#1e8449">Zeleny z=0.5</text>
  <text x="534" y="222" text-anchor="middle" font-size="11" fill="#333">0.5 &lt; 0.3 ?  NE</text>
  <text x="534" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">ZAMITNUTO</text>

  <!-- Result -->
  <rect x="20" y="265" width="660" height="50" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="350" y="290" text-anchor="middle" font-size="14" fill="#333">
    <tspan font-weight="bold">Vysledek:</tspan> Pixel ma barvu
    <tspan fill="#c0392b" font-weight="bold">cerveneho</tspan> trojuhelniku (z = 0.3) — je nejblize kamere
  </text>

  <!-- Summary note -->
  <text x="350" y="340" text-anchor="middle" font-size="12" fill="#888" font-style="italic">Z-buffer funguje spravne bez ohledu na poradi vykreslovani trojuhelniku.</text>
  <text x="350" y="358" text-anchor="middle" font-size="12" fill="#888" font-style="italic">Kazdy fragment se porovnava s aktualni hodnotou — mensi z vyhraje.</text>
</svg>