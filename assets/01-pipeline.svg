<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Section labels -->
  <rect x="50" y="18" width="360" height="28" rx="4" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="230" y="37" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Vektorova cast</text>

  <rect x="460" y="18" width="280" height="28" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="600" y="37" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Rastrova cast</text>

  <!-- Boxes row 1 -->
  <!-- 3D Geometrie -->
  <rect x="10" y="70" width="90" height="50" rx="10" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="55" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#424242">3D</text>
  <text x="55" y="107" text-anchor="middle" font-size="11" fill="#616161">Geometrie</text>

  <!-- Arrow -->
  <line x1="100" y1="95" x2="125" y2="95" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Vertex Shader -->
  <rect x="128" y="70" width="100" height="50" rx="10" fill="#bbdefb" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="178" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Vertex</text>
  <text x="178" y="107" text-anchor="middle" font-size="11" fill="#1565c0">Shader</text>

  <!-- Arrow -->
  <line x1="228" y1="95" x2="253" y2="95" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tessellation -->
  <rect x="256" y="70" width="100" height="50" rx="10" fill="#bbdefb" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="306" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Tessellation</text>

  <!-- Arrow -->
  <line x1="356" y1="95" x2="381" y2="95" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Clipping -->
  <rect x="384" y="70" width="100" height="50" rx="10" fill="#bbdefb" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="434" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Orizani</text>
  <text x="434" y="107" text-anchor="middle" font-size="11" fill="#1565c0">(Clipping)</text>

  <!-- Arrow (boundary transition) -->
  <line x1="484" y1="95" x2="509" y2="95" stroke="#e65100" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Rasterizace -->
  <rect x="512" y="70" width="100" height="50" rx="10" fill="#ffe0b2" stroke="#ff9800" stroke-width="2"/>
  <text x="562" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Rasterizace</text>

  <!-- Arrow -->
  <line x1="612" y1="95" x2="637" y2="95" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pixel Shader -->
  <rect x="640" y="70" width="100" height="50" rx="10" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="690" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Pixel</text>
  <text x="690" y="107" text-anchor="middle" font-size="11" fill="#2e7d32">Shader</text>

  <!-- Second row -->
  <!-- Arrow down from Pixel Shader -->
  <line x1="690" y1="120" x2="690" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Frame Buffer -->
  <rect x="640" y="158" width="100" height="50" rx="10" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="690" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Frame</text>
  <text x="690" y="195" text-anchor="middle" font-size="11" fill="#2e7d32">Buffer</text>

  <!-- Arrow to output -->
  <line x1="740" y1="183" x2="755" y2="183" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2D Obraz -->
  <rect x="758" y="158" width="35" height="50" rx="10" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="775" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#424242">2D</text>
  <text x="775" y="194" text-anchor="middle" font-size="9" fill="#616161">Obraz</text>

  <!-- Legend at bottom -->
  <rect x="50" y="230" width="14" height="14" rx="3" fill="#bbdefb" stroke="#64b5f6" stroke-width="1"/>
  <text x="70" y="242" font-size="11" fill="#555">Programovatelne</text>

  <rect x="180" y="230" width="14" height="14" rx="3" fill="#ffe0b2" stroke="#ff9800" stroke-width="1"/>
  <text x="200" y="242" font-size="11" fill="#555">Pevna funkce (hranice)</text>

  <rect x="350" y="230" width="14" height="14" rx="3" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1"/>
  <text x="370" y="242" font-size="11" fill="#555">Vystup</text>
</svg>
