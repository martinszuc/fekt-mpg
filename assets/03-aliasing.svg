<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="700" height="300" fill="#fafafa" rx="8"/>

  <!-- === LEFT PANEL: Sufficient sampling === -->
  <rect x="10" y="10" width="330" height="280" fill="none" stroke="#ddd" stroke-width="1" rx="6"/>
  <text x="175" y="35" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Dostatečné vzorkování</text>

  <!-- High-freq sine wave -->
  <path d="M 30,160 C 38,100 46,100 54,160 C 62,220 70,220 78,160 C 86,100 94,100 102,160 C 110,220 118,220 126,160 C 134,100 142,100 150,160 C 158,220 166,220 174,160 C 182,100 190,100 198,160 C 206,220 214,220 222,160 C 230,100 238,100 246,160 C 254,220 262,220 270,160 C 278,100 286,100 294,160 C 302,220 310,220 318,160"
        fill="none" stroke="#3498db" stroke-width="2"/>

  <!-- Many sample dots (sufficient) -->
  <circle cx="30" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="42" cy="118" r="4" fill="#e74c3c"/>
  <circle cx="54" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="66" cy="202" r="4" fill="#e74c3c"/>
  <circle cx="78" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="90" cy="118" r="4" fill="#e74c3c"/>
  <circle cx="102" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="114" cy="202" r="4" fill="#e74c3c"/>
  <circle cx="126" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="138" cy="118" r="4" fill="#e74c3c"/>
  <circle cx="150" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="162" cy="202" r="4" fill="#e74c3c"/>
  <circle cx="174" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="186" cy="118" r="4" fill="#e74c3c"/>
  <circle cx="198" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="210" cy="202" r="4" fill="#e74c3c"/>
  <circle cx="222" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="234" cy="118" r="4" fill="#e74c3c"/>
  <circle cx="246" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="258" cy="202" r="4" fill="#e74c3c"/>
  <circle cx="270" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="282" cy="118" r="4" fill="#e74c3c"/>
  <circle cx="294" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="306" cy="202" r="4" fill="#e74c3c"/>
  <circle cx="318" cy="160" r="4" fill="#e74c3c"/>

  <!-- Checkmark -->
  <text x="175" y="265" text-anchor="middle" fill="#27ae60" font-size="13" font-weight="bold">&#10003; Signál zachycen správně</text>

  <!-- === RIGHT PANEL: Undersampling (aliasing) === -->
  <rect x="360" y="10" width="330" height="280" fill="none" stroke="#ddd" stroke-width="1" rx="6"/>
  <text x="525" y="35" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Podvzorkování → Alias</text>

  <!-- Same high-freq sine wave (original) -->
  <path d="M 380,160 C 388,100 396,100 404,160 C 412,220 420,220 428,160 C 436,100 444,100 452,160 C 460,220 468,220 476,160 C 484,100 492,100 500,160 C 508,220 516,220 524,160 C 532,100 540,100 548,160 C 556,220 564,220 572,160 C 580,100 588,100 596,160 C 604,220 612,220 620,160 C 628,100 636,100 644,160 C 652,220 660,220 668,160"
        fill="none" stroke="#3498db" stroke-width="1.5" opacity="0.4"/>

  <!-- Too few sample dots -->
  <circle cx="380" cy="160" r="5" fill="#e74c3c"/>
  <circle cx="428" cy="160" r="5" fill="#e74c3c"/>
  <circle cx="476" cy="160" r="5" fill="#e74c3c"/>
  <circle cx="524" cy="160" r="5" fill="#e74c3c"/>
  <circle cx="572" cy="160" r="5" fill="#e74c3c"/>
  <circle cx="620" cy="160" r="5" fill="#e74c3c"/>
  <circle cx="668" cy="160" r="5" fill="#e74c3c"/>

  <!-- Alias: false low-frequency signal through the sample points (a flat line here since all samples hit the same phase) -->
  <line x1="380" y1="160" x2="668" y2="160" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="8,4"/>

  <!-- Label the alias -->
  <text x="525" y="140" text-anchor="middle" fill="#e67e22" font-size="13" font-weight="bold">Falešný signál (alias)</text>

  <!-- X mark -->
  <text x="525" y="265" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="bold">&#10007; Vzorky neodlišují od konstanty!</text>
</svg>