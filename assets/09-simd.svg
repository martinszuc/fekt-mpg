<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="regA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#5BA3EC"/>
    </linearGradient>
    <linearGradient id="regB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8833A"/>
      <stop offset="100%" stop-color="#F09850"/>
    </linearGradient>
    <linearGradient id="regC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#50B86C"/>
      <stop offset="100%" stop-color="#66CC80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="300" fill="#FAFAFA" rx="8"/>

  <!-- Divider -->
  <line x1="340" y1="20" x2="340" y2="280" stroke="#DDD" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- LEFT: Scalar -->
  <text x="160" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Skalarni</text>

  <!-- Scalar operations -->
  <g transform="translate(30, 48)">
    <!-- Op 1 -->
    <rect x="0" y="0" width="50" height="28" rx="4" fill="url(#regA)"/>
    <text x="25" y="19" text-anchor="middle" font-size="12" fill="white">a[0]</text>
    <text x="60" y="19" text-anchor="middle" font-size="16" fill="#666">+</text>
    <rect x="72" y="0" width="50" height="28" rx="4" fill="url(#regB)"/>
    <text x="97" y="19" text-anchor="middle" font-size="12" fill="white">b[0]</text>
    <text x="132" y="19" text-anchor="middle" font-size="16" fill="#666">=</text>
    <rect x="144" y="0" width="50" height="28" rx="4" fill="url(#regC)"/>
    <text x="169" y="19" text-anchor="middle" font-size="12" fill="white">c[0]</text>
    <text x="220" y="19" font-size="11" fill="#999">op 1</text>

    <!-- Op 2 -->
    <rect x="0" y="42" width="50" height="28" rx="4" fill="url(#regA)"/>
    <text x="25" y="61" text-anchor="middle" font-size="12" fill="white">a[1]</text>
    <text x="60" y="61" text-anchor="middle" font-size="16" fill="#666">+</text>
    <rect x="72" y="42" width="50" height="28" rx="4" fill="url(#regB)"/>
    <text x="97" y="61" text-anchor="middle" font-size="12" fill="white">b[1]</text>
    <text x="132" y="61" text-anchor="middle" font-size="16" fill="#666">=</text>
    <rect x="144" y="42" width="50" height="28" rx="4" fill="url(#regC)"/>
    <text x="169" y="61" text-anchor="middle" font-size="12" fill="white">c[1]</text>
    <text x="220" y="61" font-size="11" fill="#999">op 2</text>

    <!-- Op 3 -->
    <rect x="0" y="84" width="50" height="28" rx="4" fill="url(#regA)"/>
    <text x="25" y="103" text-anchor="middle" font-size="12" fill="white">a[2]</text>
    <text x="60" y="103" text-anchor="middle" font-size="16" fill="#666">+</text>
    <rect x="72" y="84" width="50" height="28" rx="4" fill="url(#regB)"/>
    <text x="97" y="103" text-anchor="middle" font-size="12" fill="white">b[2]</text>
    <text x="132" y="103" text-anchor="middle" font-size="16" fill="#666">=</text>
    <rect x="144" y="84" width="50" height="28" rx="4" fill="url(#regC)"/>
    <text x="169" y="103" text-anchor="middle" font-size="12" fill="white">c[2]</text>
    <text x="220" y="103" font-size="11" fill="#999">op 3</text>

    <!-- Op 4 -->
    <rect x="0" y="126" width="50" height="28" rx="4" fill="url(#regA)"/>
    <text x="25" y="145" text-anchor="middle" font-size="12" fill="white">a[3]</text>
    <text x="60" y="145" text-anchor="middle" font-size="16" fill="#666">+</text>
    <rect x="72" y="126" width="50" height="28" rx="4" fill="url(#regB)"/>
    <text x="97" y="145" text-anchor="middle" font-size="12" fill="white">b[3]</text>
    <text x="132" y="145" text-anchor="middle" font-size="16" fill="#666">=</text>
    <rect x="144" y="126" width="50" height="28" rx="4" fill="url(#regC)"/>
    <text x="169" y="145" text-anchor="middle" font-size="12" fill="white">c[3]</text>
    <text x="220" y="145" font-size="11" fill="#999">op 4</text>
  </g>

  <!-- Scalar label -->
  <rect x="90" y="240" width="140" height="32" rx="6" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
  <text x="160" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#E74C3C">4 operace</text>

  <!-- RIGHT: SIMD -->
  <text x="520" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SIMD (vektorove)</text>

  <g transform="translate(370, 90)">
    <!-- Register A: wide -->
    <rect x="0" y="0" width="260" height="36" rx="6" fill="url(#regA)" stroke="#3A7BC8" stroke-width="1"/>
    <text x="32" y="23" text-anchor="middle" font-size="13" fill="white">a[0]</text>
    <line x1="65" y1="2" x2="65" y2="34" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="97" y="23" text-anchor="middle" font-size="13" fill="white">a[1]</text>
    <line x1="130" y1="2" x2="130" y2="34" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="162" y="23" text-anchor="middle" font-size="13" fill="white">a[2]</text>
    <line x1="195" y1="2" x2="195" y2="34" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="227" y="23" text-anchor="middle" font-size="13" fill="white">a[3]</text>

    <!-- Plus -->
    <text x="130" y="60" text-anchor="middle" font-size="20" font-weight="bold" fill="#666">+</text>

    <!-- Register B: wide -->
    <rect x="0" y="68" width="260" height="36" rx="6" fill="url(#regB)" stroke="#D0722E" stroke-width="1"/>
    <text x="32" y="91" text-anchor="middle" font-size="13" fill="white">b[0]</text>
    <line x1="65" y1="70" x2="65" y2="102" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="97" y="91" text-anchor="middle" font-size="13" fill="white">b[1]</text>
    <line x1="130" y1="70" x2="130" y2="102" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="162" y="91" text-anchor="middle" font-size="13" fill="white">b[2]</text>
    <line x1="195" y1="70" x2="195" y2="102" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="227" y="91" text-anchor="middle" font-size="13" fill="white">b[3]</text>

    <!-- Equals -->
    <text x="130" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#666">=</text>

    <!-- Register C: wide -->
    <rect x="0" y="136" width="260" height="36" rx="6" fill="url(#regC)" stroke="#3EA85A" stroke-width="1"/>
    <text x="32" y="159" text-anchor="middle" font-size="13" fill="white">c[0]</text>
    <line x1="65" y1="138" x2="65" y2="170" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="97" y="159" text-anchor="middle" font-size="13" fill="white">c[1]</text>
    <line x1="130" y1="138" x2="130" y2="170" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="162" y="159" text-anchor="middle" font-size="13" fill="white">c[2]</text>
    <line x1="195" y1="138" x2="195" y2="170" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="227" y="159" text-anchor="middle" font-size="13" fill="white">c[3]</text>
  </g>

  <!-- SIMD label -->
  <rect x="450" y="240" width="140" height="32" rx="6" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="520" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">1 operace</text>

  <!-- 128-bit label -->
  <text x="500" y="82" text-anchor="middle" font-size="11" fill="#888">128-bit registr</text>
</svg>
