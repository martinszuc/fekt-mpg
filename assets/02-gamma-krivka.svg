<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 500" width="650" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .axis-label { font-size: 14px; fill: #333; font-weight: bold; }
      .tick-label { font-size: 11px; fill: #666; }
      .curve-label { font-size: 13px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="650" height="500" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1"/>

  <!-- Title -->
  <text x="370" y="35" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Gama korekce</text>

  <!-- Graph area: origin at (90,420), width=480, height=360 -->
  <!-- Grid -->
  <g stroke="#e0e0e0" stroke-width="0.8">
    <!-- Vertical grid lines at 0.25, 0.5, 0.75, 1.0 -->
    <line x1="210" y1="60" x2="210" y2="420"/>
    <line x1="330" y1="60" x2="330" y2="420"/>
    <line x1="450" y1="60" x2="450" y2="420"/>
    <line x1="570" y1="60" x2="570" y2="420"/>
    <!-- Horizontal grid lines at 0.25, 0.5, 0.75, 1.0 -->
    <line x1="90" y1="330" x2="570" y2="330"/>
    <line x1="90" y1="240" x2="570" y2="240"/>
    <line x1="90" y1="150" x2="570" y2="150"/>
    <line x1="90" y1="60" x2="570" y2="60"/>
  </g>

  <!-- Axes -->
  <line x1="90" y1="420" x2="580" y2="420" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="420" x2="90" y2="50" stroke="#333" stroke-width="2"/>

  <!-- X axis ticks and labels -->
  <text x="90" y="445" class="tick-label" text-anchor="middle">0</text>
  <text x="210" y="445" class="tick-label" text-anchor="middle">0.25</text>
  <text x="330" y="445" class="tick-label" text-anchor="middle">0.5</text>
  <text x="450" y="445" class="tick-label" text-anchor="middle">0.75</text>
  <text x="570" y="445" class="tick-label" text-anchor="middle">1.0</text>

  <!-- Y axis ticks and labels -->
  <text x="80" y="424" class="tick-label" text-anchor="end">0</text>
  <text x="80" y="334" class="tick-label" text-anchor="end">0.25</text>
  <text x="80" y="244" class="tick-label" text-anchor="end">0.5</text>
  <text x="80" y="154" class="tick-label" text-anchor="end">0.75</text>
  <text x="80" y="64" class="tick-label" text-anchor="end">1.0</text>

  <!-- Axis labels -->
  <text x="330" y="478" class="axis-label" text-anchor="middle">Vstup (normalizovany)</text>
  <text x="30" y="240" class="axis-label" text-anchor="middle" transform="rotate(-90, 30, 240)">Vystup (jas)</text>

  <!-- Curve: gamma = 1.0 (linear, dashed) -->
  <!-- y = x, from (90,420) to (570,60) -->
  <line x1="90" y1="420" x2="570" y2="60" stroke="#888" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="498" y="108" class="curve-label" fill="#888">&#947; = 1.0</text>
  <text x="498" y="123" font-size="11" fill="#888">(linearni)</text>

  <!-- Curve: gamma = 2.2 (monitor, red) -->
  <!-- y = x^2.2, sampled points -->
  <!-- x=0: y=0, x=0.1: 0.006, x=0.2: 0.029, x=0.3: 0.074, x=0.4: 0.141, x=0.5: 0.218 (calculated as 0.5^2.2) -->
  <!-- x=0.6: 0.327, x=0.7: 0.456, x=0.8: 0.608, x=0.9: 0.787, x=1.0: 1.0 -->
  <!-- Map: px_x = 90 + val*480, px_y = 420 - val*360 -->
  <polyline points="
    90,420
    138,418
    186,410
    234,393
    282,369
    330,342
    378,302
    426,256
    474,201
    522,137
    570,60
  " fill="none" stroke="#d32f2f" stroke-width="2.5"/>
  <text x="420" y="310" class="curve-label" fill="#d32f2f">&#947; = 2.2</text>
  <text x="420" y="325" font-size="11" fill="#d32f2f">(monitor)</text>

  <!-- Curve: gamma = 1/2.2 ≈ 0.4545 (correction, blue) -->
  <!-- y = x^0.4545, sampled points -->
  <!-- x=0: 0, x=0.1: 0.352, x=0.2: 0.481, x=0.3: 0.573, x=0.4: 0.646 -->
  <!-- x=0.5: 0.710, x=0.6: 0.766, x=0.7: 0.817, x=0.8: 0.864, x=0.9: 0.907, x=1.0: 1.0 (calculated as x^(1/2.2)) -->
  <polyline points="
    90,420
    138,293
    186,247
    234,214
    282,187
    330,164
    378,144
    426,126
    474,109
    522,94
    570,60
  " fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <text x="172" y="195" class="curve-label" fill="#1565c0">&#947; = 1/2.2</text>
  <text x="172" y="210" font-size="11" fill="#1565c0">(korekce)</text>

  <!-- Annotation: point (0.5, 0.218) on gamma=2.2 curve -->
  <!-- x=0.5 -> px=330, y=0.218 -> py=420-0.218*360=420-78.5=341.5 -->
  <circle cx="330" cy="342" r="5" fill="#d32f2f" stroke="white" stroke-width="2"/>

  <!-- Dashed lines to the point -->
  <line x1="330" y1="342" x2="330" y2="420" stroke="#d32f2f" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="90" y1="342" x2="330" y2="342" stroke="#d32f2f" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Annotation label -->
  <rect x="130" y="348" width="185" height="22" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="222" y="364" text-anchor="middle" font-size="11" fill="#e65100">Vstup 0.5 &#8594; jas pouze 0.218!</text>

  <!-- Y-axis annotation for 0.218 -->
  <text x="80" y="346" class="tick-label" text-anchor="end" fill="#d32f2f">0.22</text>
</svg>
