<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="sans-serif" font-size="14">
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Graf scény — robotická ruka</text>

  <!-- Node style: rounded rectangles -->

  <!-- Level 0: Svět -->
  <rect x="245" y="45" width="110" height="36" rx="8" ry="8" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
  <text x="300" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">Svět</text>

  <!-- Edge: Svět → Robot -->
  <line x1="300" y1="81" x2="300" y2="115" stroke="#666" stroke-width="1.5"/>
  <rect x="272" y="88" width="56" height="20" rx="4" ry="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="300" y="103" text-anchor="middle" font-size="11" fill="#e65100" font-weight="bold">T(x,y,z)</text>

  <!-- Level 1: Robot -->
  <rect x="245" y="115" width="110" height="36" rx="8" ry="8" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
  <text x="300" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">Robot</text>

  <!-- Edge: Robot → Tělo -->
  <line x1="230" y1="151" x2="150" y2="185" stroke="#666" stroke-width="1.5"/>

  <!-- Edge: Robot → Rameno -->
  <line x1="370" y1="151" x2="450" y2="185" stroke="#666" stroke-width="1.5"/>
  <rect x="380" y="158" width="52" height="20" rx="4" ry="4" fill="#ffebee" stroke="#e53935" stroke-width="1"/>
  <text x="406" y="173" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">R(θ₁)</text>

  <!-- Level 2: Tělo -->
  <rect x="90" y="185" width="110" height="36" rx="8" ry="8" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
  <text x="145" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">Tělo</text>

  <!-- Level 2: Rameno -->
  <rect x="395" y="185" width="110" height="36" rx="8" ry="8" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
  <text x="450" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">Rameno</text>

  <!-- Edge: Rameno → Předloktí -->
  <line x1="450" y1="221" x2="450" y2="255" stroke="#666" stroke-width="1.5"/>
  <rect x="424" y="228" width="52" height="20" rx="4" ry="4" fill="#ffebee" stroke="#e53935" stroke-width="1"/>
  <text x="450" y="243" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">R(θ₂)</text>

  <!-- Level 3: Předloktí -->
  <rect x="395" y="255" width="110" height="36" rx="8" ry="8" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
  <text x="450" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">Předloktí</text>

  <!-- Edge: Předloktí → Ruka -->
  <line x1="450" y1="291" x2="450" y2="325" stroke="#666" stroke-width="1.5"/>
  <rect x="424" y="298" width="52" height="20" rx="4" ry="4" fill="#ffebee" stroke="#e53935" stroke-width="1"/>
  <text x="450" y="313" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">R(θ₃)</text>

  <!-- Level 4: Ruka -->
  <rect x="395" y="325" width="110" height="36" rx="8" ry="8" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
  <text x="450" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">Ruka</text>

  <!-- Legend -->
  <rect x="30" y="300" width="18" height="14" rx="3" ry="3" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="54" y="312" font-size="11" fill="#333">T = translace (posunutí)</text>
  <rect x="30" y="322" width="18" height="14" rx="3" ry="3" fill="#ffebee" stroke="#e53935" stroke-width="1"/>
  <text x="54" y="334" font-size="11" fill="#333">R = rotace (kloub)</text>

  <!-- Formula -->
  <text x="170" y="370" font-size="12" fill="#666">M_ruka = T(x,y,z) · R(θ₁) · R(θ₂) · R(θ₃)</text>
  <text x="170" y="387" font-size="11" fill="#999">Globální transformace = součin od kořene k uzlu</text>
</svg>
