<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="600" height="400" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Algoritmus de Casteljau (t = 0,5)</text>

  <!-- Coordinate mapping:
       P0=(0,0) -> (80,360)
       P1=(1,3) -> (180,60)
       P2=(3,3) -> (380,60)
       P3=(4,0) -> (480,360)
       Scale: x*100+80, 360-y*100
  -->

  <!-- Background Bézier curve -->
  <path d="M 80,360 C 180,60 380,60 480,360" fill="none" stroke="#ccc" stroke-width="2"/>

  <!-- Level 0: Control polygon (light gray) -->
  <line x1="80" y1="360" x2="180" y2="60" stroke="#ddd" stroke-width="1.5"/>
  <line x1="180" y1="60" x2="380" y2="60" stroke="#ddd" stroke-width="1.5"/>
  <line x1="380" y1="60" x2="480" y2="360" stroke="#ddd" stroke-width="1.5"/>

  <!-- Level 1 points: P01=(0.5,1.5)->(130,210), P11=(2,3)->(280,60), P21=(3.5,1.5)->(430,210) -->
  <line x1="130" y1="210" x2="280" y2="60" stroke="#3498db" stroke-width="1.5"/>
  <line x1="280" y1="60" x2="430" y2="210" stroke="#3498db" stroke-width="1.5"/>

  <!-- Level 2 points: P02=(1.25,2.25)->(205,135), P12=(2.75,2.25)->(355,135) -->
  <line x1="205" y1="135" x2="355" y2="135" stroke="#e67e22" stroke-width="1.5"/>

  <!-- === POINTS === -->

  <!-- Level 0 control points (gray) -->
  <circle cx="80" cy="360" r="6" fill="#666"/>
  <text x="58" y="378" fill="#666" font-size="13" font-weight="bold">P₀</text>
  <text x="55" y="393" fill="#999" font-size="11">(0, 0)</text>

  <circle cx="180" cy="60" r="6" fill="#666"/>
  <text x="155" y="50" fill="#666" font-size="13" font-weight="bold">P₁</text>
  <text x="152" y="42" fill="#999" font-size="11">(1, 3)</text>

  <circle cx="380" cy="60" r="6" fill="#666"/>
  <text x="390" y="50" fill="#666" font-size="13" font-weight="bold">P₂</text>
  <text x="387" y="42" fill="#999" font-size="11">(3, 3)</text>

  <circle cx="480" cy="360" r="6" fill="#666"/>
  <text x="488" y="378" fill="#666" font-size="13" font-weight="bold">P₃</text>
  <text x="485" y="393" fill="#999" font-size="11">(4, 0)</text>

  <!-- Level 1 points (blue) -->
  <circle cx="130" cy="210" r="5" fill="#3498db"/>
  <text x="85" y="220" fill="#3498db" font-size="12" font-weight="bold">P₀¹</text>
  <text x="82" y="235" fill="#3498db" font-size="10">(0,5; 1,5)</text>

  <circle cx="280" cy="60" r="5" fill="#3498db"/>
  <text x="280" y="82" fill="#3498db" font-size="12" font-weight="bold" text-anchor="middle">P₁¹</text>
  <text x="280" y="96" fill="#3498db" font-size="10" text-anchor="middle">(2; 3)</text>

  <circle cx="430" cy="210" r="5" fill="#3498db"/>
  <text x="440" y="225" fill="#3498db" font-size="12" font-weight="bold">P₂¹</text>
  <text x="437" y="240" fill="#3498db" font-size="10">(3,5; 1,5)</text>

  <!-- Level 2 points (orange) -->
  <circle cx="205" cy="135" r="5" fill="#e67e22"/>
  <text x="160" y="135" fill="#e67e22" font-size="12" font-weight="bold">P₀²</text>
  <text x="140" y="150" fill="#e67e22" font-size="10">(1,25; 2,25)</text>

  <circle cx="355" cy="135" r="5" fill="#e67e22"/>
  <text x="365" y="130" fill="#e67e22" font-size="12" font-weight="bold">P₁²</text>
  <text x="362" y="150" fill="#e67e22" font-size="10">(2,75; 2,25)</text>

  <!-- Final point (red, larger) -->
  <circle cx="280" cy="135" r="8" fill="#e74c3c"/>
  <text x="280" y="120" text-anchor="middle" fill="#e74c3c" font-size="14" font-weight="bold">q(0,5)</text>
  <text x="280" y="108" text-anchor="middle" fill="#e74c3c" font-size="11">(2,0; 2,25)</text>

  <!-- Legend -->
  <rect x="430" y="295" width="155" height="95" fill="white" stroke="#ddd" rx="4"/>
  <circle cx="445" cy="313" r="4" fill="#666"/>
  <text x="455" y="317" fill="#666" font-size="11">Řídicí body</text>
  <circle cx="445" cy="333" r="4" fill="#3498db"/>
  <text x="455" y="337" fill="#3498db" font-size="11">Úroveň 1</text>
  <circle cx="445" cy="353" r="4" fill="#e67e22"/>
  <text x="455" y="357" fill="#e67e22" font-size="11">Úroveň 2</text>
  <circle cx="445" cy="373" r="5" fill="#e74c3c"/>
  <text x="455" y="377" fill="#e74c3c" font-size="11">Výsledek q(t)</text>
</svg>