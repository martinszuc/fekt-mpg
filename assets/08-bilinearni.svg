<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="arrowBi" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
    <marker id="arrowBiG" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="500" height="450" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Bilinearni interpolace</text>

  <!-- Grid -->
  <rect x="80" y="50" width="200" height="200" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <line x1="80" y1="50" x2="280" y2="50" stroke="#999" stroke-width="2"/>
  <line x1="80" y1="250" x2="280" y2="250" stroke="#999" stroke-width="2"/>
  <line x1="80" y1="50" x2="80" y2="250" stroke="#999" stroke-width="2"/>
  <line x1="280" y1="50" x2="280" y2="250" stroke="#999" stroke-width="2"/>

  <!-- Corner values (texels) -->
  <!-- Bottom-left f(0,0)=100 -->
  <circle cx="80" cy="250" r="8" fill="#555"/>
  <text x="55" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">100</text>
  <text x="55" y="290" text-anchor="middle" font-size="11" fill="#888">f(0,0)</text>

  <!-- Bottom-right f(1,0)=200 -->
  <circle cx="280" cy="250" r="8" fill="#555"/>
  <text x="305" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">200</text>
  <text x="305" y="290" text-anchor="middle" font-size="11" fill="#888">f(1,0)</text>

  <!-- Top-left f(0,1)=150 -->
  <circle cx="80" cy="50" r="8" fill="#555"/>
  <text x="55" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">150</text>
  <text x="55" y="60" text-anchor="middle" font-size="11" fill="#888">f(0,1)</text>

  <!-- Top-right f(1,1)=250 -->
  <circle cx="280" cy="50" r="8" fill="#555"/>
  <text x="305" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">250</text>
  <text x="305" y="60" text-anchor="middle" font-size="11" fill="#888">f(1,1)</text>

  <!-- Sample point (0.3, 0.7) — u=0.3 from left, v=0.7 from bottom = 0.3 from top -->
  <circle cx="140" cy="110" r="6" fill="#e74c3c"/>
  <text x="165" y="105" font-size="12" font-weight="bold" fill="#e74c3c">(0.3, 0.7)</text>

  <!-- u axis label -->
  <text x="180" y="268" text-anchor="middle" font-size="12" fill="#4a90d9">u = 0.3</text>
  <line x1="140" y1="253" x2="140" y2="258" stroke="#4a90d9" stroke-width="1.5"/>

  <!-- v axis label -->
  <text x="50" y="115" text-anchor="middle" font-size="12" fill="#27ae60">v=0.7</text>
  <line x1="73" y1="110" x2="78" y2="110" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Dashed lines for sample position -->
  <line x1="140" y1="250" x2="140" y2="110" stroke="#4a90d9" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="110" x2="140" y2="110" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step annotations on right side -->
  <rect x="330" y="50" width="160" height="160" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>

  <text x="410" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90d9">Krok 1: ve smeru u</text>
  <text x="410" y="92" text-anchor="middle" font-size="11" fill="#333">Dolni: (1-0.3).100</text>
  <text x="410" y="107" text-anchor="middle" font-size="11" fill="#333">+ 0.3.200 = 130</text>
  <text x="410" y="127" text-anchor="middle" font-size="11" fill="#333">Horni: (1-0.3).150</text>
  <text x="410" y="142" text-anchor="middle" font-size="11" fill="#333">+ 0.3.250 = 180</text>

  <line x1="340" y1="152" x2="480" y2="152" stroke="#ddd" stroke-width="1"/>

  <text x="410" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Krok 2: ve smeru v</text>
  <text x="410" y="190" text-anchor="middle" font-size="11" fill="#333">(1-0.7).130 + 0.7.180</text>
  <text x="410" y="205" text-anchor="middle" font-size="11" fill="#333">= 39 + 126</text>

  <!-- Horizontal interpolation markers on grid -->
  <!-- Bottom edge result -->
  <circle cx="140" cy="250" r="4" fill="#4a90d9"/>
  <text x="140" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90d9">130</text>

  <!-- Top edge result -->
  <circle cx="140" cy="50" r="4" fill="#4a90d9"/>
  <text x="140" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90d9">180</text>

  <!-- Result box -->
  <rect x="100" y="340" width="300" height="50" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="250" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">f(0.3, 0.7) = 165</text>
  <text x="250" y="382" text-anchor="middle" font-size="12" fill="#888">Vysledek bilinearni interpolace</text>

  <!-- Arrow from sample point to result -->
  <line x1="140" y1="118" x2="200" y2="335" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Axis labels -->
  <text x="180" y="320" text-anchor="middle" font-size="12" fill="#888">u (horizontalni)</text>
  <text x="28" y="155" text-anchor="middle" font-size="12" fill="#888" transform="rotate(-90, 28, 155)">v (vertikalni)</text>
</svg>