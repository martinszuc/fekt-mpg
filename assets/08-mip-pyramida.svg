<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="sans-serif" font-size="14">
  <defs>
    <!-- Checkerboard pattern for level 0 (fine) -->
    <pattern id="check0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#555"/>
      <rect x="8" y="8" width="8" height="8" fill="#555"/>
      <rect x="8" width="8" height="8" fill="#ddd"/>
      <rect y="8" width="8" height="8" fill="#ddd"/>
    </pattern>
    <!-- Checkerboard pattern for level 1 (medium) -->
    <pattern id="check1" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#777"/>
      <rect x="8" y="8" width="8" height="8" fill="#777"/>
      <rect x="8" width="8" height="8" fill="#bbb"/>
      <rect y="8" width="8" height="8" fill="#bbb"/>
    </pattern>
    <!-- Checkerboard for level 2 (coarser) -->
    <pattern id="check2" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#888"/>
      <rect x="10" y="10" width="10" height="10" fill="#888"/>
      <rect x="10" width="10" height="10" fill="#aaa"/>
      <rect y="10" width="10" height="10" fill="#aaa"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="700" height="300" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">MIP-map pyramida</text>

  <!-- Level 0: 256x256 -->
  <rect x="20" y="45" width="128" height="128" fill="url(#check0)" stroke="#333" stroke-width="1.5" rx="2"/>
  <text x="84" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Uroven 0</text>
  <text x="84" y="205" text-anchor="middle" font-size="11" fill="#666">256 x 256</text>
  <text x="84" y="220" text-anchor="middle" font-size="11" fill="#888">4.00 MB</text>

  <!-- Arrow -->
  <text x="162" y="110" text-anchor="middle" font-size="18" fill="#aaa">/2</text>

  <!-- Level 1: 128x128 -->
  <rect x="180" y="77" width="64" height="64" fill="url(#check1)" stroke="#333" stroke-width="1.5" rx="2"/>
  <text x="212" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Uroven 1</text>
  <text x="212" y="173" text-anchor="middle" font-size="11" fill="#666">128 x 128</text>
  <text x="212" y="188" text-anchor="middle" font-size="11" fill="#888">1.00 MB</text>

  <!-- Arrow -->
  <text x="258" y="110" text-anchor="middle" font-size="18" fill="#aaa">/2</text>

  <!-- Level 2: 64x64 -->
  <rect x="275" y="93" width="32" height="32" fill="url(#check2)" stroke="#333" stroke-width="1.5" rx="2"/>
  <text x="291" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Uroven 2</text>
  <text x="291" y="157" text-anchor="middle" font-size="11" fill="#666">64 x 64</text>

  <!-- Arrow -->
  <text x="320" y="110" text-anchor="middle" font-size="18" fill="#aaa">/2</text>

  <!-- Level 3: 32x32 -->
  <rect x="337" y="101" width="16" height="16" fill="#999" stroke="#333" stroke-width="1.5" rx="1"/>
  <text x="345" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Uroven 3</text>
  <text x="345" y="149" text-anchor="middle" font-size="11" fill="#666">32 x 32</text>

  <!-- Level 4: 16x16 -->
  <rect x="375" y="105" width="8" height="8" fill="#aaa" stroke="#333" stroke-width="1" rx="1"/>
  <text x="379" y="128" text-anchor="middle" font-size="11" fill="#666">4</text>

  <!-- Level 5: 8x8 -->
  <rect x="400" y="107" width="4" height="4" fill="#bbb" stroke="#333" stroke-width="0.5"/>
  <text x="402" y="122" text-anchor="middle" font-size="10" fill="#666">5</text>

  <!-- Dots -->
  <text x="420" y="112" font-size="14" fill="#888">...</text>

  <!-- Level 8: 1x1 -->
  <rect x="448" y="108" width="3" height="3" fill="#ccc" stroke="#333" stroke-width="0.5"/>
  <text x="450" y="122" text-anchor="middle" font-size="10" fill="#666">1x1</text>

  <!-- Memory annotation -->
  <rect x="430" y="45" width="250" height="100" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="555" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Pametova cena</text>
  <text x="555" y="92" text-anchor="middle" font-size="12" fill="#333">Originalni textura: 4.00 MB</text>
  <text x="555" y="110" text-anchor="middle" font-size="12" fill="#333">Vsechny MIP urovne: +1.33 MB</text>
  <text x="555" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Celkem: 5.33 MB (+33%)</text>

  <!-- Formula -->
  <text x="350" y="255" text-anchor="middle" font-size="13" fill="#555">Kazda uroven = 1/4 predchozi: 1 + 1/4 + 1/16 + 1/64 + ... = 4/3 originalu</text>

  <!-- Bottom note -->
  <text x="350" y="280" text-anchor="middle" font-size="12" fill="#888" font-style="italic">GPU automaticky vybere uroven podle velikosti objektu na obrazovce</text>
</svg>