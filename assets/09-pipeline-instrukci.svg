<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="fetch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#3A7BC8"/>
    </linearGradient>
    <linearGradient id="decode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#50B86C"/>
      <stop offset="100%" stop-color="#3EA85A"/>
    </linearGradient>
    <linearGradient id="execute" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8833A"/>
      <stop offset="100%" stop-color="#D0722E"/>
    </linearGradient>
    <linearGradient id="writeback" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D94A4A"/>
      <stop offset="100%" stop-color="#C43A3A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="300" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Pipeline instrukci</text>

  <!-- Column headers (clock cycles) -->
  <g font-size="13" fill="#666" text-anchor="middle">
    <text x="220" y="52">T1</text>
    <text x="286" y="52">T2</text>
    <text x="352" y="52">T3</text>
    <text x="418" y="52">T4</text>
    <text x="484" y="52">T5</text>
    <text x="550" y="52">T6</text>
    <text x="616" y="52">T7</text>
  </g>

  <!-- Row labels -->
  <g font-size="14" font-weight="bold" fill="#333">
    <text x="170" y="87" text-anchor="end">Instrukce 1</text>
    <text x="170" y="137" text-anchor="end">Instrukce 2</text>
    <text x="170" y="187" text-anchor="end">Instrukce 3</text>
    <text x="170" y="237" text-anchor="end">Instrukce 4</text>
  </g>

  <!-- Cell size: 60w x 40h, gap 6 -->
  <!-- I1: F D E W at T1-T4 -->
  <rect x="192" y="66" width="56" height="32" rx="4" fill="url(#fetch)"/>
  <text x="220" y="87" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Fetch</text>

  <rect x="258" y="66" width="56" height="32" rx="4" fill="url(#decode)"/>
  <text x="286" y="87" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Decode</text>

  <rect x="324" y="66" width="56" height="32" rx="4" fill="url(#execute)"/>
  <text x="352" y="87" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Exec</text>

  <rect x="390" y="66" width="56" height="32" rx="4" fill="url(#writeback)"/>
  <text x="418" y="87" text-anchor="middle" font-size="12" fill="white" font-weight="bold">WB</text>

  <!-- I2: F D E W at T2-T5 -->
  <rect x="258" y="116" width="56" height="32" rx="4" fill="url(#fetch)"/>
  <text x="286" y="137" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Fetch</text>

  <rect x="324" y="116" width="56" height="32" rx="4" fill="url(#decode)"/>
  <text x="352" y="137" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Decode</text>

  <rect x="390" y="116" width="56" height="32" rx="4" fill="url(#execute)"/>
  <text x="418" y="137" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Exec</text>

  <rect x="456" y="116" width="56" height="32" rx="4" fill="url(#writeback)"/>
  <text x="484" y="137" text-anchor="middle" font-size="12" fill="white" font-weight="bold">WB</text>

  <!-- I3: F D E W at T3-T6 -->
  <rect x="324" y="166" width="56" height="32" rx="4" fill="url(#fetch)"/>
  <text x="352" y="187" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Fetch</text>

  <rect x="390" y="166" width="56" height="32" rx="4" fill="url(#decode)"/>
  <text x="418" y="187" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Decode</text>

  <rect x="456" y="166" width="56" height="32" rx="4" fill="url(#execute)"/>
  <text x="484" y="187" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Exec</text>

  <rect x="522" y="166" width="56" height="32" rx="4" fill="url(#writeback)"/>
  <text x="550" y="187" text-anchor="middle" font-size="12" fill="white" font-weight="bold">WB</text>

  <!-- I4: F D E W at T4-T7 -->
  <rect x="390" y="216" width="56" height="32" rx="4" fill="url(#fetch)"/>
  <text x="418" y="237" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Fetch</text>

  <rect x="456" y="216" width="56" height="32" rx="4" fill="url(#decode)"/>
  <text x="484" y="237" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Decode</text>

  <rect x="522" y="216" width="56" height="32" rx="4" fill="url(#execute)"/>
  <text x="550" y="237" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Exec</text>

  <rect x="588" y="216" width="56" height="32" rx="4" fill="url(#writeback)"/>
  <text x="616" y="237" text-anchor="middle" font-size="12" fill="white" font-weight="bold">WB</text>

  <!-- Bottom annotation -->
  <text x="350" y="278" text-anchor="middle" font-size="13" fill="#555">Bez pipeline: 4 x 4 = 16 cyklu | S pipeline: 4 + 3 = <tspan font-weight="bold" fill="#2E7D32">7 cyklu</tspan></text>

  <!-- Legend -->
  <g transform="translate(15, 270)">
    <rect x="0" y="-10" width="12" height="12" rx="2" fill="url(#fetch)"/>
    <text x="16" y="0" font-size="10" fill="#666">Fetch</text>
    <rect x="52" y="-10" width="12" height="12" rx="2" fill="url(#decode)"/>
    <text x="68" y="0" font-size="10" fill="#666">Decode</text>
    <rect x="110" y="-10" width="12" height="12" rx="2" fill="url(#execute)"/>
    <text x="126" y="0" font-size="10" fill="#666">Exec</text>
    <rect x="160" y="-10" width="12" height="12" rx="2" fill="url(#writeback)"/>
    <text x="176" y="0" font-size="10" fill="#666">WB</text>
  </g>
</svg>
