<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" font-family="sans-serif" font-size="14">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#ccc" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Bresenhamův algoritmus: úsečka (2,1) → (7,4)</text>

  <!-- Grid area offset -->
  <g transform="translate(50, 40)">
    <!-- Grid background -->
    <rect x="0" y="0" width="500" height="280" fill="white" stroke="#999" stroke-width="1"/>

    <!-- Grid lines -->
    <g stroke="#e0e0e0" stroke-width="0.5">
      <!-- Vertical -->
      <line x1="50" y1="0" x2="50" y2="280"/>
      <line x1="100" y1="0" x2="100" y2="280"/>
      <line x1="150" y1="0" x2="150" y2="280"/>
      <line x1="200" y1="0" x2="200" y2="280"/>
      <line x1="250" y1="0" x2="250" y2="280"/>
      <line x1="300" y1="0" x2="300" y2="280"/>
      <line x1="350" y1="0" x2="350" y2="280"/>
      <line x1="400" y1="0" x2="400" y2="280"/>
      <line x1="450" y1="0" x2="450" y2="280"/>
      <!-- Horizontal -->
      <line x1="0" y1="50" x2="500" y2="50"/>
      <line x1="0" y1="100" x2="500" y2="100"/>
      <line x1="0" y1="150" x2="500" y2="150"/>
      <line x1="0" y1="200" x2="500" y2="200"/>
      <line x1="0" y1="230" x2="500" y2="230"/>
    </g>

    <!-- Pixel coordinates: x goes 0-9 (50px each), y goes 0-5 (50px each, inverted) -->
    <!-- Y-axis is inverted: pixel y=0 at bottom (y=250), y=5 at top (y=0) -->

    <!-- Selected pixels (light blue) - Bresenham output -->
    <!-- (2,1) → grid x=100, y=200 -->
    <rect x="100" y="200" width="50" height="50" fill="#b3d9ff" stroke="#999" stroke-width="0.5"/>
    <!-- (3,2) → grid x=150, y=150 -->
    <rect x="150" y="150" width="50" height="50" fill="#b3d9ff" stroke="#999" stroke-width="0.5"/>
    <!-- (4,2) → grid x=200, y=150 -->
    <rect x="200" y="150" width="50" height="50" fill="#b3d9ff" stroke="#999" stroke-width="0.5"/>
    <!-- (5,3) → grid x=250, y=100 -->
    <rect x="250" y="100" width="50" height="50" fill="#b3d9ff" stroke="#999" stroke-width="0.5"/>
    <!-- (6,3) → grid x=300, y=100 -->
    <rect x="300" y="100" width="50" height="50" fill="#b3d9ff" stroke="#999" stroke-width="0.5"/>
    <!-- (7,4) → grid x=350, y=50 -->
    <rect x="350" y="50" width="50" height="50" fill="#b3d9ff" stroke="#999" stroke-width="0.5"/>

    <!-- Ideal line (red) from center of pixel (2,1) to center of pixel (7,4) -->
    <!-- (2,1) center: (125, 225), (7,4) center: (375, 75) -->
    <line x1="125" y1="225" x2="375" y2="75" stroke="#e53935" stroke-width="2" stroke-dasharray="6,3"/>

    <!-- Pixel center dots -->
    <circle cx="125" cy="225" r="4" fill="#1565c0"/>
    <circle cx="175" cy="175" r="4" fill="#1565c0"/>
    <circle cx="225" cy="175" r="4" fill="#1565c0"/>
    <circle cx="275" cy="125" r="4" fill="#1565c0"/>
    <circle cx="325" cy="125" r="4" fill="#1565c0"/>
    <circle cx="375" cy="75" r="4" fill="#1565c0"/>

    <!-- Start/End labels -->
    <text x="125" y="245" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">(2,1)</text>
    <text x="375" y="68" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">(7,4)</text>

    <!-- X-axis labels -->
    <text x="25" y="270" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="75" y="270" text-anchor="middle" font-size="11" fill="#666">1</text>
    <text x="125" y="270" text-anchor="middle" font-size="11" fill="#666">2</text>
    <text x="175" y="270" text-anchor="middle" font-size="11" fill="#666">3</text>
    <text x="225" y="270" text-anchor="middle" font-size="11" fill="#666">4</text>
    <text x="275" y="270" text-anchor="middle" font-size="11" fill="#666">5</text>
    <text x="325" y="270" text-anchor="middle" font-size="11" fill="#666">6</text>
    <text x="375" y="270" text-anchor="middle" font-size="11" fill="#666">7</text>
    <text x="425" y="270" text-anchor="middle" font-size="11" fill="#666">8</text>
    <text x="475" y="270" text-anchor="middle" font-size="11" fill="#666">9</text>

    <!-- Y-axis labels -->
    <text x="-8" y="229" text-anchor="end" font-size="11" fill="#666">1</text>
    <text x="-8" y="179" text-anchor="end" font-size="11" fill="#666">2</text>
    <text x="-8" y="129" text-anchor="end" font-size="11" fill="#666">3</text>
    <text x="-8" y="79" text-anchor="end" font-size="11" fill="#666">4</text>
    <text x="-8" y="29" text-anchor="end" font-size="11" fill="#666">5</text>
  </g>

  <!-- Legend -->
  <rect x="420" y="300" width="15" height="15" fill="#b3d9ff" stroke="#999" stroke-width="0.5"/>
  <text x="440" y="312" font-size="11" fill="#333">Vykreslené pixely</text>
  <line x1="420" y1="328" x2="435" y2="328" stroke="#e53935" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="440" y="332" font-size="11" fill="#333">Ideální přímka</text>
</svg>
