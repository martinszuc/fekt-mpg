<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="g0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#F9C800"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#689F38"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#039BE5"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C6BC0"/>
      <stop offset="100%" stop-color="#3F51B5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="450" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="250" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Hierarchie pameti</text>

  <!-- Pyramid layers — trapezoids -->
  <!-- Layer 0: Registry (top, narrowest) -->
  <polygon points="220,50 280,50 310,108 190,108" fill="url(#g0)" stroke="white" stroke-width="2"/>
  <text x="250" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Registry</text>
  <text x="250" y="96" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">&lt; 1 ns, ~KB</text>

  <!-- Layer 1: L1 Cache -->
  <polygon points="190,110 310,110 345,168 155,168" fill="url(#g1)" stroke="white" stroke-width="2"/>
  <text x="250" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="white">L1 Cache</text>
  <text x="250" y="156" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">~1 ns, ~32 KB</text>

  <!-- Layer 2: L2 Cache -->
  <polygon points="155,170 345,170 380,228 120,228" fill="url(#g2)" stroke="white" stroke-width="2"/>
  <text x="250" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">L2 Cache</text>
  <text x="250" y="216" text-anchor="middle" font-size="11" fill="#666">~5 ns, ~256 KB</text>

  <!-- Layer 3: L3 Cache -->
  <polygon points="120,230 380,230 415,288 85,288" fill="url(#g3)" stroke="white" stroke-width="2"/>
  <text x="250" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="white">L3 Cache</text>
  <text x="250" y="276" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">~15 ns, ~MB</text>

  <!-- Layer 4: RAM -->
  <polygon points="85,290 415,290 445,348 55,348" fill="url(#g4)" stroke="white" stroke-width="2"/>
  <text x="250" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="white">RAM</text>
  <text x="250" y="336" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">~100 ns, ~GB</text>

  <!-- Layer 5: Disk/SSD -->
  <polygon points="55,350 445,350 470,408 30,408" fill="url(#g5)" stroke="white" stroke-width="2"/>
  <text x="250" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Disk / SSD</text>
  <text x="250" y="396" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">~ms, ~TB</text>

  <!-- Left arrow: Rychlost -->
  <line x1="22" y1="390" x2="22" y2="70" stroke="#E53935" stroke-width="2.5" marker-end="url(#arrowUp)"/>
  <defs>
    <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,8 L4,0 L8,8" fill="#E53935"/>
    </marker>
  </defs>
  <text x="20" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#E53935" transform="rotate(-90, 20, 240)">Rychlost</text>

  <!-- Right arrow: Kapacita -->
  <line x1="478" y1="70" x2="478" y2="390" stroke="#3F51B5" stroke-width="2.5" marker-end="url(#arrowDown)"/>
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M0,0 L4,8 L8,0" fill="#3F51B5"/>
    </marker>
  </defs>
  <text x="480" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#3F51B5" transform="rotate(90, 480, 240)">Kapacita</text>
</svg>
